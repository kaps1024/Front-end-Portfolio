<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adote seu PET</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
     <header class="titulo">
      <img src="images/titulo.png" alt="">

       <nav>
        <a href="index.html">Entrar</a>
        <a href="./signup.html">Cadastro</a>
      </nav>
    </header>
     
 

    <!-- Fiz com get pq com post não simula a mudança de página ao simular login -->
    <!-- para ir para o forms de adoção -->
    <div class="container">
      <form class="login" id="form-esqueceu" action="#" method="get" >
        <h2 class="login-title">Esqueceu sua senha?</h2>

        <div class="login-item">
          <label for="user_email">E-mail</label>
          <input
            class="input"
            type="email"
            name="user_email"
            id="user_email"
            placeholder="seuemail@email.com"
            required
          />
        </div>
        <div class="login-item">
          <button class="button" type="submit">Enviar</button>
        </div>
        <p class="links">
          <a href="./index.html">Login</a>
        </p>
      </form>

      <div id="mensagem-sucesso" class="login" style="display: none; text-align: center;">
        <h2 class="login-title">E-mail Enviado!</h2>
        <p>Você receberá um email para renovação de senha em poucos minutos.</p>
        <p class="links">
          <a href="./index.html">Voltar para o Login</a>
        </p>
      </div>
    </div>

    <script>
      const form = document.getElementById("form-esqueceu");
      const mensagem = document.getElementById("mensagem-sucesso");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        form.style.display = "none";
        mensagem.style.display = "block";
      });
    </script>
  </body>
</html>
